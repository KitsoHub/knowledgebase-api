[tool.poetry]
name = "your-app"
version = "0.1.0"
description = ""
authors = ["SamKenpachi"]

[tool.poetry.dependencies]
python = "^3.9"
Django = ">=4.0.4,<4.1"
djangorestframework = ">=3.13.1,<3.14"
drf-spectacular = ">=0.22.1,<0.23"
django-cors-headers = "*"
psycopg2 = ">=2.8.6,<2.9"
Pillow = ">=8.2.0,<8.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude = .venv, __pycache__, docs/source/conf.py, old, build, dist, git
max-complexity = 10
